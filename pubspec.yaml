name: bag_finder
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0' 

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_modular: ^6.3.2
  animated_text_kit: ^4.2.3
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0
  logger: ^2.4.0
  provider: ^6.1.1
  dropdown_button2: ^2.3.9
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  dartz: ^0.10.1
  event_bus: ^2.0.1
  uuid: ^4.5.1
  flutter_gen: ^5.11.0
  http: ^1.2.2
  shared_preferences: ^2.2.3
  flutter_dotenv: ^6.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/flying-around.png
    - assets/images/group-interrogation.png
    - assets/images/luggage-two-persons.png
    - assets/images/paper-macute.png
    - assets/images/two-persons.png
    - assets/images/bagfinder-login.png
    - assets/images/bagfinder-sign-up.png
    - assets/images/logo_appbar.png


flutter_intl:
  enabled: true
  arb_dir: lib/l10n
  output_dir: lib/generated
